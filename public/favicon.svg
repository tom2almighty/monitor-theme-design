<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Neutral Dark Server Chassis without Orange Background -->
  <rect x="2" y="2" width="28" height="28" rx="6.5" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>

  <!-- Blade 1 (Online Active Primary with Circular Pulse) -->
  <rect x="4.5" y="4.5" width="23" height="6.5" rx="1.8" fill="#1E293B"/>
  <!-- Circular Ripple Wave 1 (Animated concentric circle, strictly circular, no square filter clipping) -->
  <circle cx="8" cy="7.75" r="2.8" fill="#10B981" fill-opacity="0.25">
    <animate attributeName="r" values="1.6;3.2;1.6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.45;0.06;0.45" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Circular Soft Aura -->
  <circle cx="8" cy="7.75" r="2.1" fill="#10B981" fill-opacity="0.38"/>
  <!-- Core Active Beacon -->
  <circle cx="8" cy="7.75" r="1.3" fill="#10B981"/>
  <!-- Activity Metric Lines -->
  <line x1="13" y1="7.75" x2="24" y2="7.75" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Blade 2 (Online Secondary) -->
  <rect x="4.5" y="12.75" width="23" height="6.5" rx="1.8" fill="#1E293B"/>
  <circle cx="8" cy="16" r="1.3" fill="#10B981"/>
  <line x1="13" y1="16" x2="22" y2="16" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Blade 3 (Online Standby) -->
  <rect x="4.5" y="21" width="23" height="6.5" rx="1.8" fill="#1E293B"/>
  <circle cx="8" cy="24.25" r="1.3" fill="#10B981" fill-opacity="0.8"/>
  <line x1="13" y1="24.25" x2="19" y2="24.25" stroke="#64748B" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.6"/>
</svg>
