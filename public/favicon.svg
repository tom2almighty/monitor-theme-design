<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="arcBg" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5CBCE0"/>
      <stop offset="55%" stop-color="#6E82DF"/>
      <stop offset="100%" stop-color="#7F72DC"/>
    </linearGradient>
    <linearGradient id="arcSheen" x1="16" y1="2" x2="16" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Arc squircle frame -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="8.5" fill="url(#arcBg)"/>
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#arcSheen)" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="1"/>

  <!-- Live telemetry pulse waveform -->
  <path d="M6.5 17.2 H10.8 L13.7 10.2 L17.5 21.4 L20.4 14.8 H24.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Active live beacon -->
  <circle cx="24.5" cy="14.8" r="3.4" fill="#FFFFFF" fill-opacity="0.26"/>
  <circle cx="24.5" cy="14.8" r="1.75" fill="#FFFFFF"/>
</svg>
